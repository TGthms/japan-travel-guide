<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Japan Travel Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#A31F36"/>
      <stop offset="100%" stop-color="#6B1220"/>
    </linearGradient>
    <linearGradient id="fuji" x1="0.5" y1="0.15" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFF9F6"/>
      <stop offset="45%" stop-color="#F0E0DA"/>
      <stop offset="100%" stop-color="#D4B5AE"/>
    </linearGradient>
  </defs>
  <!-- Mark background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Soft sky glow -->
  <circle cx="47" cy="15" r="9" fill="#F7C8D0" opacity="0.28"/>
  <!-- Mount Fuji base shadow -->
  <path d="M7 51 L23 20.5 L32 33 L41 19 L57 51 Z" fill="#4A0E18" opacity="0.35"/>
  <!-- Mount Fuji face -->
  <path d="M8 50 L23 22 L32 33.5 L41 20.5 L56 50 Z" fill="url(#fuji)"/>
  <!-- Classic snow cap -->
  <path d="M23 22 L27.2 29.2 L32 25.5 L36.8 29.5 L41 20.5 L32 33.5 Z" fill="#FFFFFF"/>
  <!-- Sakura flower (simple 5-petal) -->
  <g transform="translate(13.5 13.5)" fill="#F8B4C4">
    <circle cx="0" cy="-4.2" r="2.35"/>
    <circle cx="4.0" cy="-1.3" r="2.35"/>
    <circle cx="2.5" cy="3.5" r="2.35"/>
    <circle cx="-2.5" cy="3.5" r="2.35"/>
    <circle cx="-4.0" cy="-1.3" r="2.35"/>
    <circle cx="0" cy="0" r="1.55" fill="#FCE8EE"/>
  </g>
  <!-- Small drifting petal -->
  <ellipse cx="22" cy="9" rx="1.4" ry="1.0" fill="#F8B4C4" opacity="0.75" transform="rotate(-25 22 9)"/>
</svg>
